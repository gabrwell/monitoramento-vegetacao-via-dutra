[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verde-rodovias"
version = "0.1.0"
description = "Prova de conceito para priorização visual de inspeções de vegetação em rodovias"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.5",
  "rasterio==1.5.1",
  "pystac-client==0.9.0",
  "planetary-computer==1.0.0",
  "pyproj==3.8.0",
  "matplotlib==3.11.2",
  "python-docx==1.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
